root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/api/main.go"
bin = "./tmp/main"
full_bin = ""
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
include_dir = []
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
log = "air.log"
poll = false
poll_interval = 0
delay = 1000 # ms
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
rerun = false
rerun_delay = 500

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[log]
time = false
main_only = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true

